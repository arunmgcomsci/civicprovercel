{% extends 'base.html' %}
{% block title %}Login — CivicPro{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 py-20">
    <!-- Background blobs -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
        <div class="absolute top-1/3 left-1/4 w-72 h-72 bg-blue-600/10 rounded-full blur-3xl"></div>
        <div class="absolute bottom-1/3 right-1/4 w-64 h-64 bg-purple-600/10 rounded-full blur-3xl"></div>
    </div>

    <div class="relative w-full max-w-md">
        <!-- Logo Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center gap-3 mb-4">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center text-2xl shadow-2xl">⚡</div>
                <span class="text-2xl font-bold gradient-text">CivicPro</span>
            </div>
            <h1 class="text-2xl font-bold text-white">Welcome back</h1>
            <p class="text-gray-400 mt-1">Sign in to your account to continue</p>
        </div>

        <!-- Login Card -->
        <div class="glass-card rounded-3xl p-8 border border-gray-700/50">
            <form method="post" class="space-y-5">
                {% csrf_token %}

                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Username</label>
                    <input type="text" name="username" id="id_username" required
                           class="w-full px-4 py-3 bg-gray-800 border border-gray-600 rounded-xl text-white placeholder-gray-400 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all"
                           placeholder="Enter your username">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Password</label>
                    <div class="relative">
                        <input type="password" name="password" id="id_password" required
                               class="w-full px-4 py-3 bg-gray-800 border border-gray-600 rounded-xl text-white placeholder-gray-400 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all"
                               placeholder="Enter your password">
                        <button type="button" id="togglePwd"
                                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white transition-colors">
                            👁️
                        </button>
                    </div>
                </div>

                <button type="submit"
                        class="w-full py-3 px-4 bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white font-semibold rounded-xl transition-all shadow-lg shadow-blue-900/30 text-sm">
                    Sign In →
                </button>
            </form>

            <div class="mt-6 text-center space-y-2">
                <p class="text-gray-400 text-sm">
                    New worker?
                    <a href="{% url 'register_worker' %}" class="text-blue-400 hover:text-blue-300 font-medium transition-colors">Register here</a>
                </p>
                <p class="text-gray-400 text-sm">
                    Looking to hire?
                    <a href="{% url 'register_employer' %}" class="text-green-400 hover:text-green-300 font-medium transition-colors">Employer sign-up</a>
                </p>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
    document.getElementById('togglePwd').addEventListener('click', function() {
        const pwd = document.getElementById('id_password');
        pwd.type = pwd.type === 'password' ? 'text' : 'password';
        this.textContent = pwd.type === 'password' ? '👁️' : '🙈';
    });
</script>
{% endblock %}
